<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" font-family="'Segoe UI', Roboto, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#132743"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#2c4a68" opacity="0.4"/>
    </pattern>
  </defs>
<!--============ BACKGROUND ============-->
  <rect x="0" y="0" width="1200" height="900" rx="18" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="900" rx="18" fill="url(#dots)"/>
<!--============ TITLE ============-->
  <text x="600" y="36" text-anchor="middle" fill="#eaf2f8" font-size="24" font-weight="700">Hospital Network — Live Topology</text>
  <text x="600" y="58" text-anchor="middle" fill="#8fa3b8" font-size="12">3-Site Hub-and-Spoke · OSPF Area 0 · Packet Tracer / Ali Hasnain</text>
  <circle cx="1150" cy="28" r="5" fill="#2ecc71">
    <animate attributeName="opacity" values="1;0.25;1" dur="1.4s" repeatCount="indefinite"/>
  </circle>
  <text x="1163" y="32" fill="#2ecc71" font-size="12" font-weight="600">LIVE</text>
<!--============ ZONES ============-->
