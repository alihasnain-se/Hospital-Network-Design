<!--============ PING PACKETS ============-->
<!--IT Reception <-> Billing (via IT-Router -> Entrance-Router)-->
  <circle r="5" fill="#2ecc71" filter="url(#glow)">
    <animateMotion dur="8s" repeatCount="indefinite" path="M700,460 L600,320 L600,180 L205,180 L205,320 L70,460
